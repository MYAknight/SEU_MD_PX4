# =============================================================================
# huaqiccc 变形无人机 —— 实际测量安全飞行空间配置
# =============================================================================
# 坐标系：与 /mavros/local_position/pose 一致（ENU）
# 所有水平位置单位：米
#
# 地面角点按顺序连接成闭合凸四边形：左前 -> 左后 -> 右后 -> 右前
#
# 注意：根据 2026-06-13 飞控日志校准，动捕坐标系中实际地面高度约为 z=-0.10
#（原测量值 z=0.1 与动捕坐标系存在约 0.20m 的系统偏差）。
# 以下 z 值已按实际飞行数据修正。
# =============================================================================

safe_space:
  # 地面四个角点（x, y, z）
  corners:
    - [1.233, 1.542, -0.10]    # 左前
    - [-0.433, 1.337, -0.10]   # 左后
    - [-0.5, -0.246, -0.10]    # 右后
    - [1.432, -0.305, -0.10]   # 右前

  # 起飞/降落中心点（必须位于多边形内部）
  home: [0.332, 0.727, -0.10]

  # 允许飞行的高度范围（地面 z=-0.10，向上 2m）
  z_min: -0.15
  z_max: 1.85

# =============================================================================
# 任务参数
# =============================================================================
mission:
  flight_height: 1.0          # 飞行高度（相对地面的高度）
  takeoff_height: 1.0         # 起飞目标高度
  cruise_speed: 0.3           # 轨迹飞行速度（m/s）
  takeoff_speed: 0.2          # 起飞速度（m/s）
  land_speed: 0.2             # 降落速度（m/s）
  hover_time: 10.0            # 悬停时间（s）
  setpoint_rate: 20.0         # setpoint 发布频率（Hz）
  safety_margin: 0.30         # 轨迹点/飞行器距边界的最小安全距离（m）
  land_final_height: 0.3      # 切 LAND 模式前下降到的高度（m，相对地面）
  default_mode: 2             # 默认 MPCA_MODE：0=PID, 1=GS-PID, 2=LQR, 3=MPC

# =============================================================================
# 通信与硬件配置（供 launch_env.sh 读取）
# =============================================================================
vrpn_server: 192.168.1.5
vrpn_tracker: Tracker1
serial_port: /dev/ttyUSB0
baudrate: 115200
vision_throttle_hz: 40.0
